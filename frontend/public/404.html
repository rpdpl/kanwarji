<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // Store the current path and redirect to index.html with the path as a parameter
      const currentPath =
        window.location.pathname +
        window.location.search +
        window.location.hash;
      sessionStorage.setItem("redirectPath", currentPath);
      window.location.replace("/");
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
